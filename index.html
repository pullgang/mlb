<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Live MLB Games</title>
  <style>
    body {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      margin: 0;
      padding: 0;
      background-image: url("https://i.imgur.com/nOvnQP3.png");
      background-size: contain;
    }
    .grid-container {
      display: grid;
      width: 100%;
      max-width: 100vw;
      box-sizing: border-box;
      justify-content: center;
    }
    .iframe-container {
      position: relative;
      height: 100%;
      width: 100%;
      aspect-ratio: 16 / 9;
      transition: all 0.3s ease;
    }
    iframe {
      width: 100%;
      height: 100%;
      border-radius: 0px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .feature-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .iframe-container:hover .feature-btn {
      opacity: 1;
    }
    .iframe-container.featured {
      grid-column: span 2;
      grid-row: span 2;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div style="display: flex; flex-wrap: wrap; width: 100%;">
    <div class="grid-container" id="iframeGrid"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
